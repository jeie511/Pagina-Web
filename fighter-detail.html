<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de luchador - Super Smash Bros. Ultimate</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@1,700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --fighter-accent: #e60012; }
    body { background-color: #000; color: #fff; margin: 0; font-family: 'Roboto', sans-serif; overflow: hidden; }

    .fighter-detail-page {
      position: relative; width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 75%, #333 0%, #000 82%);
    }

    .bg-number {
      position: absolute; font-size: 45vw; font-weight: 900;
      color: rgba(255, 255, 255, 0.03); left: 5%; z-index: 1; pointer-events: none;
    }

    /* --- ANIMACIÓN UNIVERSAL PARA EL MODELO --- */
    @keyframes fighterEntry {
      0% {
        opacity: 0;
        transform: translateX(120px) scale(0.85);
        filter: blur(15px) brightness(2);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
        filter: blur(0) brightness(1);
      }
    }

    .fighter-img {
      position: relative; 
      max-height: 85vh; 
      z-index: 3;
      filter: drop-shadow(0 0 50px rgba(0,0,0,0.8));
      animation: fighterEntry 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      will-change: transform, opacity, filter;
    }

    .info-container { 
      position: absolute; 
      left: 8%; 
      z-index: 4; 
      max-width: 500px;
      animation: fadeInText 0.6s ease-out 0.4s both;
    }

    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .number-badge {
      display: inline-block; background: var(--fighter-accent); color: #fff;
      padding: 5px 15px; font-weight: 900; font-style: italic; font-size: 24px;
      margin-bottom: 10px; transform: skewX(-15deg);
    }

    .name-title {
      font-family: 'Roboto Condensed', sans-serif; font-size: 80px;
      font-weight: 900; font-style: italic; text-transform: uppercase;
      margin: 0; line-height: 0.9;
    }

    .series-tag {
      font-family: 'Roboto Condensed', sans-serif; font-size: 22px;
      color: var(--fighter-accent); text-transform: uppercase;
      margin-top: 10px; letter-spacing: 2px; font-weight: 700;
    }

    .tagline { font-size: 18px; margin: 20px 0; color: #ccc; line-height: 1.4; }

    .debut-box { margin-top: 30px; border-left: 4px solid var(--fighter-accent); padding-left: 20px; }
    .debut-label { display: block; font-size: 12px; text-transform: uppercase; color: #888; letter-spacing: 1px; }
    .debut-value { font-size: 24px; font-weight: 700; font-family: 'Roboto Condensed', sans-serif; font-style: italic; }

    .btn-back {
      position: absolute; top: 40px; left: 40px; z-index: 10;
      color: #fff; text-decoration: none; font-weight: bold;
      text-transform: uppercase; border: 2px solid #fff; padding: 10px 20px; transition: 0.3s;
    }
    .btn-back:hover { background: #fff; color: #000; }

    /* --- BOTONES DE NAVEGACIÓN --- */
    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); color: white; border: none;
      font-size: 40px; padding: 30px 15px; cursor: pointer; z-index: 10;
      transition: 0.3s; font-family: 'Roboto Condensed', sans-serif;
    }
    .nav-btn:hover { background: var(--fighter-accent); color: white; }
    .prev-btn { left: 0; clip-path: polygon(0 0, 100% 15%, 100% 85%, 0 100%); }
    .next-btn { right: 0; clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 85%); }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .fighter-detail-page { flex-direction: column; height: auto; min-height: 100vh; padding: 100px 20px; }
      .fighter-img { max-height: 50vh; width: 100%; object-fit: contain; }
      .info-container { position: static; margin-top: 30px; text-align: center; }
      .nav-btn { top: auto; bottom: 20px; transform: none; padding: 10px 30px; font-size: 24px; }
      .prev-btn { left: 20px; }
      .next-btn { right: 20px; }
    }
  </style>
</head>

  <a href="fighters.html" class="btn-back">Volver</a>

    function loadFighter() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || 'mario';
      const data = fighters[id];

      if (data) {
        document.getElementById('fighter-name').innerText = data.name;
        document.getElementById('fighter-number').innerText = data.number;
        document.getElementById('bg-number').innerText = data.number;
        document.getElementById('fighter-series').innerText = data.series;
        document.getElementById('fighter-debut').innerText = data.debut;
        document.getElementById('fighter-tagline').innerText = data.tagline;
        
        const img = document.getElementById('fighter-img');
        // Reiniciamos animación para que se vea cada vez que cambiamos
        img.style.animation = 'none';
        img.offsetHeight; // Truco para forzar el reflow
        img.style.animation = null; 
        
        img.src = data.image;
        img.alt = data.name;

        document.documentElement.style.setProperty('--fighter-accent', data.color);
      }
    }

    // Función para navegar entre personajes
    function changeFighter(direction) {
      const keys = Object.keys(fighters);
      const params = new URLSearchParams(window.location.search);
      const currentId = params.get('id') || 'mario';
      
      let currentIndex = keys.indexOf(currentId);
      let nextIndex = currentIndex + direction;

      // Loop circular: si llegas al final vas al primero, si llegas al inicio vas al último
      if (nextIndex >= keys.length) nextIndex = 0;
      if (nextIndex < 0) nextIndex = keys.length - 1;

      const nextId = keys[nextIndex];
      
      // Actualizamos la URL sin recargar la página (opcional, pero mejor para la experiencia)
      const newUrl = window.location.pathname + '?id=' + nextId;
      window.history.pushState({path: newUrl}, '', newUrl);
      
      // Cargamos los nuevos datos
      loadFighter();
    }

    window.onload = loadFighter;
  </script>
