<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escenarios – Super Smash Bros. Ultimate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,700;1,700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #000; color: #fff; margin: 0; font-family: 'Roboto', sans-serif; overflow-x: hidden; }
    
    /* Header */
    .header { 
      background: #000; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333;
      position: sticky; top: 0; z-index: 100;
    }
    .header-link { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; font-weight: bold; text-transform: uppercase; }
    .nintendo-logo { font-weight: bold; text-transform: uppercase; color: #fff; text-decoration: none; font-size: 20px; letter-spacing: 2px; }

    /* Hero */
    .stages-hero {
      background: #000 url('https://www.smashbros.com/assets_v2/img/stage/main_bg.jpg') no-repeat center;
      background-size: cover;
      padding: 80px 20px 40px;
      text-align: center;
      border-bottom: 4px solid #ffaa00;
    }

    /* Grid */
    .stages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 15px;
      padding: 40px 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Tarjeta de Escenario */
    .stage-card {
      position: relative;
      background-color: #1a1a1a;
      border: 1px solid #444;
      overflow: hidden;
      aspect-ratio: 16/9;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }

    .stage-card:hover {
      transform: scale(1.05);
      border-color: #ffaa00;
      z-index: 10;
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.4);
    }

    .stage-card img { width: 100%; height: 100%; object-fit: cover; }

    .stage-info {
      position: absolute;
      bottom: 0; width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      padding: 15px 0 8px;
      font-family: 'Roboto Condensed', sans-serif;
      font-style: italic;
      text-align: center;
      font-size: 14px;
      text-transform: uppercase;
      font-weight: bold;
      pointer-events: none;
    }

    .stage-number {
      position: absolute;
      top: 0; left: 0;
      background: #ffaa00;
      color: #000;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: bold;
      font-family: 'Roboto Condensed', sans-serif;
      z-index: 2;
    }

    /* MODAL DE PREVISUALIZACIÓN */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      max-width: 85%;
      max-height: 75%;
      border: 4px solid #ffaa00;
      box-shadow: 0 0 50px rgba(255,170,0,0.3);
      animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-caption {
      margin-top: 25px;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 40px;
      font-style: italic;
      text-transform: uppercase;
      color: #ffaa00;
      text-shadow: 0 0 15px rgba(0,0,0,0.8);
      letter-spacing: 2px;
    }

    .close-modal {
      position: absolute;
      top: 20px; right: 30px;
      color: #fff;
      font-size: 60px;
      cursor: pointer;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .footer { padding: 60px 20px; text-align: center; background: #000; color: #666; font-size: 12px; }
  </style>
</head>
<body>

  <div id="stageModal" class="modal" onclick="closePreview()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="imgFull">
    <div id="caption" class="modal-caption"></div>
  </div>

  <header class="header">
    <div class="header-left"><a href="#" class="nintendo-logo">Nintendo</a></div>
    <div class="header-right">
      <a href="index.html" class="header-link">Inicio</a>
      <a href="fighters.html" class="header-link">Luchadores</a>
    </div>
  </header>

  <section class="stages-hero">
    <h1 style="font-size: 60px; font-style: italic; font-family: 'Roboto Condensed'; margin: 0; letter-spacing: 4px;">ESCENARIOS</h1>
  </section>

  <main class="stages-grid" id="mainGrid">
    </main>

  <footer class="footer">
    <p>© 2018 Nintendo. Original Game: © Nintendo / HAL Laboratory, Inc.</p>
  </footer>

  <script>
    // LISTA MAESTRA DE LOS 103 ESCENARIOS (NOMBRES OFICIALES)
    const stageNames = [
      "Campo de batalla", "Gran campo de batalla", "Destino final", "Castillo de Peach", "Selva de Kongo", "Castillo de Hyrule", "Planet Zebes", "Isla de Yoshi", "Dream Land", "Sector Z",
      "Castillo de Saffron", "Mushroom Kingdom", "Castillo de Peach (Melee)", "Isla de Yoshi (Melee)", "Cataratas del Congo", "Montaña helada", "Jardín de Kirby", "Great Bay", "Templo", "Brinstar",
      "Yoshi's Story", "Fuente de los Sueños", "Corneria", "Venom", "Pokémon Stadium", "Onett", "Mute City SNES", "Mundo de los Yoshi", "Abismo de Brinstar", "Pokémon Stadium 2",
      "Port Town Aero Dive", "Castillo sitiado", "WarioWare, Inc.", "Pueblo Smash", "Nueva Porc", "Cumbre", "Sobrevuelo", "Norfair", "Fragata Orpheon", "Yoshi's Island",
      "Halberd", "Lylat Cruise", "Pokémon Stadium 2", "Castillo de Drácula", "Mansión de Luigi", "Pirámide", "75m", "Mario Bros.", "Hanenbow", "Zona extraplana X",
      "Green Hill Zone", "Castillo de Wily", "Reino del Cielo", "Boxing Ring", "Gaur Plain", "Circuito de Mario Kart", "Nidodepirañas", "Windy Hill", "Rosalina's Ice World", "Palutena's Temple",
      "The Great Cave Offensive", "Kalos Pokémon League", "Coliseum", "Gamer", "Garden of Hope", "Town and City", "Wii Fit Studio", "Distant Planet", "Smashville", "Skyloft",
      "Tortimer Island", "3D Land", "Golden Plains", "Rainbow Road", "Paper Mario", "Gerudo Valley", "Spirit Train", "Dream Land GB", "Unova Pokémon League", "Prism Tower",
      "Mute City", "Magicant", "Arena Ferox", "Reset Bomb Forest", "Find Mii", "Tomodachi Life", "Balloon Fight", "Living Room", "PictoChat 2", "Mushroom Kingdom U",
      "Mario Galaxy", "Skyloft", "The Great Tower", "Boxing Ring", "Gaur Plain", "Duck Hunt", "Wrecking Crew", "Pilotwings", "Wuhu Island", "Mario Circuit",
      "Pac-Land", "Suzaku Castle", "Midgar"
    ];

    const grid = document.getElementById('mainGrid');

    // GENERAR LAS TARJETAS DINÁMICAMENTE PARA EVITAR ERRORES DE URL
    stageNames.forEach((name, index) => {
      const num = (index + 1).toString().padStart(3, '0');
      const card = document.createElement('div');
      card.className = 'stage-card';
      card.innerHTML = `
        <span class="stage-number">${index + 1}</span>
        <img src="https://www.smashbros.com/assets_v2/img/stage/stage_img${num}.jpg" loading="lazy">
        <div class="stage-info">${name}</div>
      `;
      
      // Evento para abrir el Lightbox
      card.onclick = () => openPreview(`https://www.smashbros.com/assets_v2/img/stage/stage_img${num}.jpg`, name);
      grid.appendChild(card);
    });

    const modal = document.getElementById("stageModal");
    const fullImg = document.getElementById("imgFull");
    const captionText = document.getElementById("caption");

    function openPreview(src, name) {
      fullImg.src = src;
      captionText.innerText = name;
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closePreview() {
      modal.style.display = "none";
      document.body.style.overflow = "auto";
    }

    // Tecla ESC para cerrar
    document.addEventListener('keydown', (e) => { if(e.key === "Escape") closePreview(); });
  </script>
</body>
</html>
