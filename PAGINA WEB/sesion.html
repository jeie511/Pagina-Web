<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesion - Super Smash Bros. Ultimate</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .message-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 120px 20px 40px;
      background: radial-gradient(circle at top, #2d0000 0%, #080808 70%);
    }

    .message-card {
      max-width: 620px;
      text-align: center;
      background: #151515;
      border: 1px solid #2d2d2d;
      border-radius: 16px;
      padding: 36px;
    }

    .message-card h1 {
      margin-bottom: 14px;
      font-family: 'Roboto Condensed', sans-serif;
      font-style: italic;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="index.html" class="nintendo-logo">
        <svg width="100" height="28" viewBox="0 0 100 28" fill="white">
          <text x="0" y="20" font-family="Arial Black, sans-serif" font-size="16" font-weight="bold">Nintendo</text>
        </svg>
      </a>
    </div>
  </header>

  <main class="message-page">
    <section class="message-card">
      <h1>Inicio de sesion</h1>
      <p>El enlace ya no esta roto. Aqui queda una pagina de acceso informativa en lugar de un boton sin destino.</p>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
