<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de luchador - Super Smash Bros. Ultimate</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@1,700&family=Roboto:wght@900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }

    .fighter-detail-page {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 75%, #333 0%, #000 80%);
    }

    .bg-number {
      position: absolute;
      font-size: 45vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      left: 5%;
      line-height: 1;
      z-index: 1;
      pointer-events: none;
    }

    .fighter-img {
      position: relative;
      height: 85vh;
      z-index: 2;
      filter: drop-shadow(10px 10px 30px rgba(0, 0, 0, 0.9));
    }

    .info-container {
      position: absolute;
      left: 8%;
      bottom: 10%;
      z-index: 3;
      max-width: 40%;
    }

    .number-badge {
      background-color: #e60012;
      color: #fff;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 32px;
      padding: 5px 25px;
      display: inline-block;
      transform: skewX(-15deg);
      font-weight: bold;
    }

    .name-title {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: clamp(48px, 8vw, 110px);
      font-style: italic;
      text-transform: uppercase;
      margin: 10px 0 15px 0;
      line-height: 0.85;
      text-shadow: 6px 6px 0 #e60012;
    }

    .extra-details {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .series-name {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
      letter-spacing: 2px;
      border-bottom: 2px solid #fff;
      display: inline-block;
      padding-bottom: 5px;
      width: fit-content;
    }

    .debut-info {
      display: flex;
      flex-direction: column;
      border-left: 3px solid #e60012;
      padding-left: 15px;
    }

    .debut-label {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
    }

    .debut-game {
      font-weight: bold;
      font-size: 18px;
    }

    .btn-back {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 10;
      background: #fff;
      color: #000;
      padding: 12px 30px;
      text-decoration: none;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: bold;
      text-transform: uppercase;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      background: #e60012;
      color: #fff;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .fighter-detail-page {
        min-height: 100vh;
        height: auto;
        padding: 120px 20px 40px;
        flex-direction: column;
      }

      .fighter-img {
        height: auto;
        width: min(90vw, 460px);
      }

      .info-container {
        position: relative;
        left: auto;
        bottom: auto;
        max-width: 100%;
        margin-top: 24px;
        text-align: center;
      }

      .series-name {
        margin: 0 auto;
      }

      .debut-info {
        border-left: 0;
        border-top: 3px solid #e60012;
        padding-left: 0;
        padding-top: 12px;
      }
    }
  </style>
</head>
<body>
  <a href="fighters.html" class="btn-back">Volver</a>

  <div class="fighter-detail-page" data-fighter-detail>
    <div class="bg-number" data-number>--</div>
    <img src="" alt="Luchador" class="fighter-img" data-image>
    <div class="info-container">
      <div class="number-badge" data-number>--</div>
      <h1 class="name-title" data-name>Luchador</h1>
      <div class="extra-details">
        <div class="series-name" data-series>Universo Super Smash Bros.</div>
        <div class="debut-info">
          <span class="debut-label">Entrada disponible</span>
          <span class="debut-game" data-debut>Disponible en Super Smash Bros. Ultimate</span>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
