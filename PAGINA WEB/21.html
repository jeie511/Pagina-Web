<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marth - Super Smash Bros. Ultimate</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@1,700&family=Roboto:wght@900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }

    .fighter-detail-page {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 75%, #333 0%, #000 80%);
    }

    .bg-number {
      position: absolute;
      font-size: 45vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      left: 5%;
      line-height: 1;
      z-index: 1;
      pointer-events: none;
    }

    .fighter-img {
      position: relative;
      height: 90vh;
      z-index: 2;
      filter: drop-shadow(10px 10px 30px rgba(0,0,0,0.9));
      animation: fadeInRight 0.8s ease-out;
    }

    /* Contenedor de Información Izquierda */
    .info-container {
      position: absolute;
      left: 8%;
      bottom: 10%;
      z-index: 3;
      animation: fadeInLeft 0.8s ease-out;
    }

    .number-badge {
      background-color: #e60012;
      color: #fff;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 32px;
      padding: 5px 25px;
      display: inline-block;
      transform: skewX(-15deg);
      font-weight: bold;
    }

    .name-title {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: clamp(60px, 10vw, 120px);
      font-style: italic;
      text-transform: uppercase;
      margin: 10px 0 15px 0;
      line-height: 0.8;
      text-shadow: 6px 6px 0px #e60012;
    }

    /* Sección de Detalles Extra (Serie y Debut) */
    .extra-details {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-top: 20px;
    }

    .series-logo {
      height: 60px; /* Logo de Fire Emblem */
      filter: brightness(0) invert(1); /* Lo hace blanco para que resalte */
    }

    .debut-info {
      display: flex;
      flex-direction: column;
      border-left: 2px solid #e60012;
      padding-left: 15px;
    }

    .debut-label {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
    }

    .debut-game {
      font-weight: bold;
      font-size: 18px;
    }

    /* Botón Back */
    .btn-back {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 10;
      background: #fff;
      color: #000;
      padding: 12px 30px;
      text-decoration: none;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: bold;
      text-transform: uppercase;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
    }

    .btn-back:hover {
      background: #e60012;
      color: #fff;
      transform: translateX(-5px);
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-100px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

  <a href="fighters.html" class="btn-back">
    <span style="margin-right: 8px;">◀</span> BACK
  </a>

  <div class="fighter-detail-page">
    <div class="bg-number">21</div>
    
    <img src="https://www.smashbros.com/assets_v2/img/fighter/marth/main.png" alt="Marth" class="fighter-img">

    <div class="info-container">
      <div class="number-badge">21</div>
      <h1 class="name-title">MARTH</h1>

      <div class="extra-details">
        <img src="https://www.smashbros.com/assets_v2/img/fighter/marth/mark.png" alt="Fire Emblem Logo" class="series-logo">
        
        <div class="debut-info">
          <span class="debut-label">Debut</span>
          <span class="debut-game">Super Smash Bros. Melee (2001)</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
