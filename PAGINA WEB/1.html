<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario - Super Smash Bros. Ultimate</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@1,700&family=Roboto:wght@900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      margin: 0;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }

    .fighter-detail-page {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 75%, #444 0%, #000 85%);
    }

    .bg-number {
      position: absolute;
      font-size: 45vw;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.04);
      left: 5%;
      line-height: 1;
      z-index: 1;
      pointer-events: none;
    }

    .fighter-img {
      position: relative;
      height: 85vh;
      z-index: 4;
      filter: drop-shadow(10px 10px 30px rgba(0,0,0,0.9));
      animation: fadeInRight 0.8s ease-out;
    }

    .info-container {
      position: absolute;
      left: 8%;
      bottom: 10%;
      z-index: 5;
      animation: fadeInLeft 0.8s ease-out;
    }

    .number-badge {
      background-color: #e60012;
      color: #fff;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 32px;
      padding: 5px 25px;
      display: inline-block;
      transform: skewX(-15deg);
      font-weight: bold;
    }

    .name-title {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: clamp(50px, 10vw, 120px);
      font-style: italic;
      text-transform: uppercase;
      margin: 10px 0 15px 0;
      line-height: 0.8;
      text-shadow: 6px 6px 0px #e60012;
    }

    .extra-details {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 25px;
    }

    /* NOMBRE DE LA SAGA EN TEXTO */
    .series-name {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      color: #fff;
      letter-spacing: 2px;
      border-bottom: 2px solid #fff;
      display: inline-block;
      padding-bottom: 5px;
      width: fit-content;
    }

    .debut-info {
      display: flex;
      flex-direction: column;
      border-left: 3px solid #e60012;
      padding-left: 15px;
    }

    .debut-label {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 14px;
      color: #aaa;
      text-transform: uppercase;
    }

    .debut-game {
      font-weight: bold;
      font-size: 18px;
    }

    .btn-back {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 10;
      background: #fff;
      color: #000;
      padding: 12px 30px;
      text-decoration: none;
      font-family: 'Roboto Condensed', sans-serif;
      font-weight: bold;
      text-transform: uppercase;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
      transition: all 0.3s ease;
    }

    .btn-back:hover {
      background: #e60012;
      color: #fff;
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeInLeft {
      from { opacity: 0; transform: translateX(-100px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

  <a href="fighters.html" class="btn-back">◀ BACK</a>

  <div class="fighter-detail-page">
    <div class="bg-number">01</div>
    
    <img src="https://www.smashbros.com/assets_v2/img/fighter/mario/main.png" alt="Mario" class="fighter-img">

    <div class="info-container">
      <div class="number-badge">01</div>
      <h1 class="name-title">MARIO</h1>

      <div class="extra-details">
        <div class="series-name">Super Mario Series</div>
        
        <div class="debut-info">
          <span class="debut-label">Debut en la serie Smash</span>
          <span class="debut-game">Super Smash Bros. (1999)</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
