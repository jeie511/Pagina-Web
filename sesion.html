<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Super Smash Bros.</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #000; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .login-card { background: #111; padding: 40px; border: 2px solid #e60012; box-shadow: 0 0 20px rgba(230,0,18,0.5); width: 300px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #222; border: 1px solid #444; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e60012; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        button.reg-btn { background: #444; margin-top: 5px; }
        button.export-btn { background: #1a1a1a; border: 1px solid #333; margin-top: 18px; font-size: 11px; color: #666; text-transform: none; font-weight: normal; }
        button.export-btn:hover { color: #fff; border-color: #666; filter: none; }
        button:hover { filter: brightness(1.2); }
        .msg { margin-top: 12px; font-size: 13px; color: #aaa; min-height: 18px; }
        .divider { border: none; border-top: 1px solid #222; margin: 18px 0 0; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="font-style: italic;">SMASH LOGIN</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="pass" placeholder="Contraseña">

        <button onclick="handleLogin()">Entrar</button>
        <button class="reg-btn" onclick="handleRegister()">Registrarse</button>

        <p class="msg" id="msg"></p>

        <hr class="divider">
        <!-- Descarga users.json con todos los usuarios actuales -->
        <button class="export-btn" onclick="exportarUsersJSON()">⬇ Exportar users.json</button>
    </div>

    <script src="auth.js"></script>
    <script>
        function handleLogin() {
            var e = document.getElementById('email').value.trim();
            var p = document.getElementById('pass').value;
            if (e && p) {
                validarLogin(e, p);
            } else {
                document.getElementById('msg').textContent = 'Rellena todos los campos.';
            }
        }

        function handleRegister() {
            var e = document.getElementById('email').value.trim();
            var p = document.getElementById('pass').value;
            if (e && p) {
                registrarUsuario(e, p);
                document.getElementById('msg').textContent = '';
            } else {
                document.getElementById('msg').textContent = 'Rellena todos los campos.';
            }
        }

        // Enviar con Enter
        document.addEventListener('keydown', function(ev) {
            if (ev.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
